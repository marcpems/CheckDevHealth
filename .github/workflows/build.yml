name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
        configuration: [Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild CheckDevHealth.slnx /t:Restore /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /v:minimal

      - name: Build
        run: msbuild CheckDevHealth.slnx /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /v:minimal

      - name: Build MSIX package
        run: >
          msbuild src/CheckDevHealth/CheckDevHealth.csproj /t:Build
          /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
          /p:GenerateAppxPackageOnBuild=true /p:AppxBundlePlatforms=${{ matrix.platform }}
          /p:UapAppxPackageBuildMode=SideloadOnly /v:minimal

      - name: Publish self-contained build
        run: >
          msbuild src/CheckDevHealth/CheckDevHealth.csproj /t:Publish
          /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
          /p:PublishProfile=win-${{ matrix.platform }}.pubxml /v:minimal

      - name: Locate publish output
        id: locate
        shell: pwsh
        run: |
          $rid = "win-$('${{ matrix.platform }}'.ToLower())"
          $publishDir = Get-ChildItem -Path "src/CheckDevHealth/bin" -Recurse -Directory -Filter "publish" |
            Where-Object { $_.FullName -match [regex]::Escape("$rid\publish") } |
            Select-Object -First 1
          if (-not $publishDir) {
            throw "Publish output directory not found for RID '$rid'."
          }
          echo "path=$($publishDir.FullName)" >> $env:GITHUB_OUTPUT

      - name: Locate MSIX package output
        id: locate-msix
        shell: pwsh
        run: |
          $appPackagesDir = Get-ChildItem -Path "src/CheckDevHealth/AppPackages" -Recurse -Directory |
            Where-Object { $_.Name -match "_Test$" } |
            Select-Object -First 1
          if (-not $appPackagesDir) {
            throw "MSIX AppPackages output directory not found."
          }
          echo "path=$($appPackagesDir.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckDevHealth-${{ matrix.platform }}-${{ matrix.configuration }}
          path: ${{ steps.locate.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload MSIX package artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckDevHealth-${{ matrix.platform }}-${{ matrix.configuration }}-MSIX
          path: ${{ steps.locate-msix.outputs.path }}
          retention-days: 14
          if-no-files-found: error
